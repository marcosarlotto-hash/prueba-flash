<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Request Cripten</title>
<link rel="preconnect" href="https://cripten.app.n8n.cloud" crossorigin>
<link rel="icon" href="data:,">
<script>
/* ===== Settings (the only thing to change when moving to production) ===== */
window.FLASH = {
  ENDPOINT:   'https://cripten.app.n8n.cloud/webhook/incidencias-form',
  CONFIG_URL: 'https://cripten.app.n8n.cloud/webhook/incidencias-config'
};
/* Start the config request right away, in parallel with the Telegram SDK download. */
(function () {
  var m = /[#&]tgWebAppStartParam=([^&]*)/.exec(location.hash) || /[?&](?:startapp|code)=([^&]*)/.exec(location.search), code = '';
  try { code = m ? decodeURIComponent(m[1]).toLowerCase().replace(/[^a-z0-9_-]/g, '') : ''; } catch (e) {}
  window.FLASH.code = code;
  if (code && FLASH.CONFIG_URL) {
    try { window.FLASH.cfgReq = fetch(FLASH.CONFIG_URL + '?code=' + encodeURIComponent(code)).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); } catch (e) {}
  }
})();
</script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
:root{--bg:#FBFAF2;--ink:#2B2418;--mut:#6F6650;--line:#A39A63;--yel:#FFE45C;--err:#B3261E;--ok:#1E7B4A}
html,body{height:100%;background:var(--bg);color:var(--ink);font:13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
body{display:flex;flex-direction:column;padding:10px 14px calc(10px + env(safe-area-inset-bottom))}
.top{display:flex;justify-content:flex-end;margin-bottom:8px;flex:none}
.chip{background:var(--yel);border:1px solid var(--ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:12px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;min-height:0;display:flex;flex-direction:column}
form{display:flex;flex-direction:column;gap:7px;min-height:0}
.hid{display:none!important}
.row{display:flex;gap:8px}.row>*{min-width:0}
.f{display:flex;flex-direction:column;gap:3px}
.f>label,.lbl{font-weight:600;font-size:12px;display:flex;align-items:baseline;gap:4px}
.opt{font-weight:400;color:var(--mut);font-size:11px}
input[type=text],input[type=email],input[type=tel],textarea,select{width:100%;font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:0 9px;height:34px;outline:0}
textarea{height:52px;padding:7px 9px;resize:none;line-height:1.3}
input:focus,textarea:focus,.seg:focus-within{border-color:var(--ink);box-shadow:0 0 0 2px rgba(255,228,92,.7)}
.bad{border-color:var(--err)!important}
.grid{display:grid;grid-template-columns:118px 1fr;gap:7px 8px}
.grid .email{grid-column:2}
#cpf-f{display:none}
[data-c=BR] #cpf-f{display:flex}
[data-c=BR] .grid .email{grid-column:1/-1}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;height:34px;background:#fff}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-weight:600;color:var(--mut);cursor:pointer;padding:0 6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--ink);color:#fff}
#merch-f{flex:1 1 0}#country-f{flex:0 0 auto}
.drop{display:flex;align-items:center;gap:8px;border:1px dashed var(--line);border-radius:8px;background:#fff;padding:0 6px 0 9px;min-height:34px;height:34px;color:var(--mut);font-size:12px}
.drop.over{border-color:var(--ink);background:#FFF8CF}
.drop span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn2{border:1px solid var(--ink);background:#fff;color:var(--ink);font:inherit;font-weight:600;font-size:12px;border-radius:6px;height:24px;padding:0 9px;cursor:pointer;white-space:nowrap}
.file{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px 6px 4px 4px;min-height:34px}
.file .th{width:26px;height:26px;border-radius:5px;background:#EFEBD2 center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:var(--mut);flex:none}
.file .nm{flex:1;min-width:0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.file .nm small{color:var(--mut);margin-left:4px}
#err{color:var(--err);font-size:12px;font-weight:600;line-height:1.25}
.go{height:40px;border:1px solid var(--ink);border-radius:10px;background:var(--yel);color:var(--ink);font:inherit;font-weight:800;font-size:14px;cursor:pointer;margin-top:2px}
.go[disabled]{opacity:.6;cursor:default}
.res{margin:auto 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding:0 6px}
.res .ic{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;background:var(--ok)}
.res.warn .ic{background:#C98A00}
.res h1{font-size:17px}.res p{color:var(--mut);font-size:13px}
.tk{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 9px;word-break:break-all}
.res .acts{display:flex;gap:8px;margin-top:4px}
.res .acts .go{padding:0 18px;margin:0;height:36px;font-size:13px}
#demo{margin-top:auto;padding-top:8px;display:flex;gap:6px;align-items:center;font-size:11px;color:var(--mut)}
#demo select{height:26px;font-size:11px;width:auto}
@supports (-webkit-touch-callout:none){input[type=text],input[type=email],input[type=tel],textarea,select{font-size:16px}}
@media (max-height:520px){form{gap:5px}input[type=text],input[type=email],input[type=tel],.seg{height:31px}textarea{height:40px}.go{height:36px}}
</style>
</head>
<body>
<header class="top"><div class="chip" id="chip">Request Cripten</div></header>
<main id="main">
<form id="form" novalidate autocomplete="off" class="hid" data-c="">
  <div class="row" id="row-top">
    <div class="f hid" id="merch-f"><label for="merchant">Merchant</label><input type="text" id="merchant" maxlength="60" autocapitalize="words" placeholder="Merchant name"></div>
    <div class="f hid" id="country-f"><span class="lbl" id="country-l">Country</span>
      <div class="seg" role="group" aria-labelledby="country-l"><button type="button" data-c="AR" aria-pressed="false">Argentina</button><button type="button" data-c="BR" aria-pressed="false">Brazil</button></div></div>
  </div>
  <div class="f"><label for="txn">Transaction Number (TXN_ID)</label><input type="text" id="txn" maxlength="60" autocapitalize="off" spellcheck="false"></div>
  <div class="grid">
    <div class="f" id="amt-f"><label for="amount" id="amount-l">Amount</label><input type="text" id="amount" inputmode="decimal" placeholder="0.00"></div>
    <div class="f" id="cpf-f"><label for="cpf">CPF</label><input type="tel" id="cpf" inputmode="numeric" maxlength="14" placeholder="000.000.000-00"></div>
    <div class="f email"><label for="email">E-mail <span class="opt">(optional)</span></label><input type="email" id="email" maxlength="120" inputmode="email" autocapitalize="off" spellcheck="false"></div>
  </div>
  <div class="f"><label for="comment">Comments <span class="opt">(optional)</span></label><textarea id="comment" maxlength="1000" placeholder="Briefly describe the issue"></textarea></div>
  <div class="f"><span class="lbl">Proof of Payment <span class="opt">(optional · image or PDF)</span></span>
    <div class="drop" id="drop"><span id="drop-t">Paste or drop a file</span><button type="button" class="btn2" id="pick">Choose file</button></div>
    <div class="file hid" id="filebox"><div class="th" id="th"></div><div class="nm" id="fname"></div><button type="button" class="btn2" id="rm">Remove</button></div>
    <input type="file" id="file" accept="image/*,application/pdf,.pdf" class="hid">
  </div>
  <div id="err" class="hid" role="alert"></div>
  <button type="submit" class="go" id="go">Submit request</button>
</form>
<section class="res hid" id="res" aria-live="polite"><div class="ic" id="res-ic">✓</div><h1 id="res-h"></h1><p id="res-p"></p><div class="tk hid" id="res-t"></div><div class="acts"><button type="button" class="go" id="res-close">Close</button><button type="button" class="btn2" id="res-new">New request</button></div></section>
<div id="demo" class="hid"><span>Demo</span><select id="demo-sel">
  <option value="ar">Argentina only</option><option value="br">Brazil only</option><option value="both">Argentina + Brazil</option>
  <option value="multi_ar">Multimerchant · AR</option><option value="multi_br">Multimerchant · BR</option><option value="multi_both">Multimerchant · AR + BR</option></select></div>
</main>
<script>
(function () {
'use strict';
var F = window.FLASH, tg = (window.Telegram && Telegram.WebApp) || null;
var $ = function (id) { return document.getElementById(id); };
var COUNTRIES = { AR: { name: 'Argentina', cur: 'ARS' }, BR: { name: 'Brazil', cur: 'BRL' } };
var MAX_BYTES = 10 * 1024 * 1024, CPF_STRICT = true;
var DEMO = { ar: { name: 'Demo AR', countries: ['AR'] }, br: { name: 'Demo BR', countries: ['BR'] }, both: { name: 'Demo AR+BR', countries: ['AR', 'BR'] },
  multi_ar: { name: 'Demo Multi', countries: ['AR'], multimerchant: true }, multi_br: { name: 'Demo Multi', countries: ['BR'], multimerchant: true },
  multi_both: { name: 'Demo Multi', countries: ['AR', 'BR'], multimerchant: true } };
var cfg = null, country = '', file = null, busy = false, lastTicket = '';

/* ---------- Config ---------- */
function sanitize(c) {
  c = c && typeof c === 'object' ? c : {};
  var cs = (Array.isArray(c.countries) ? c.countries : ['AR']).map(function (x) { return String(x).toUpperCase(); })
    .filter(function (x, i, a) { return COUNTRIES[x] && a.indexOf(x) === i; });
  if (!cs.length) cs = ['AR'];
  return { name: String(c.name || '').slice(0, 40), countries: cs, multi: c.multimerchant === true || c.multi === true };
}
var CK = 'flash_cfg_v2_' + (F.code || '');
function readCache() { try { var o = JSON.parse(localStorage.getItem(CK)); if (o && Date.now() - o.t < 7 * 864e5) return o.c; } catch (e) {} return null; }
function writeCache(c) { try { localStorage.setItem(CK, JSON.stringify({ t: Date.now(), c: c })); } catch (e) {} }

function applyConfig(c) {
  cfg = c;
  $('chip').textContent = 'Request Cripten' + (c.name ? ' - ' + c.name : '');
  $('merch-f').classList.toggle('hid', !c.multi);
  var both = c.countries.length > 1;
  $('country-f').classList.toggle('hid', !both);
  $('row-top').classList.toggle('hid', !c.multi && !both);
  if (!both) setCountry(c.countries[0]); else if (c.countries.indexOf(country) < 0) setCountry('');
  else setCountry(country);
}
function setCountry(c) {
  country = c;
  $('form').setAttribute('data-c', c);
  var cur = c ? COUNTRIES[c].cur : '';
  $('amount-l').textContent = cur ? 'Amount (' + cur + ')' : 'Amount';
  [].forEach.call(document.querySelectorAll('.seg button'), function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-c') === c)); });
  $('country-f').classList.remove('bad');
}

/* ---------- Validation helpers ---------- */
function validCPF(d) {
  if (!/^\d{11}$/.test(d)) return false;
  if (!CPF_STRICT) return true;
  if (/^(\d)\1{10}$/.test(d)) return false;
  for (var t = 9; t < 11; t++) {
    var s = 0; for (var i = 0; i < t; i++) s += +d[i] * (t + 1 - i);
    if (((s * 10) % 11) % 10 !== +d[t]) return false;
  }
  return true;
}
function parseAmount(raw) {
  var t = String(raw || '').trim().replace(/[^\d.,]/g, ''); if (!t) return NaN;
  var lc = t.lastIndexOf(','), ld = t.lastIndexOf('.');
  if (lc > -1 && ld > -1) t = lc > ld ? t.replace(/\./g, '').replace(',', '.') : t.replace(/,/g, '');
  else if (lc > -1) t = /,\d{1,2}$/.test(t) ? t.replace(',', '.') : t.replace(/,/g, '');
  else if (ld > -1 && !/\.\d{1,2}$/.test(t)) t = t.replace(/\./g, '');
  return parseFloat(t);
}
function maskCPF(v) {
  var d = v.replace(/\D/g, '').slice(0, 11), o = d.slice(0, 3);
  if (d.length > 3) o += '.' + d.slice(3, 6); if (d.length > 6) o += '.' + d.slice(6, 9); if (d.length > 9) o += '-' + d.slice(9, 11);
  return o;
}
function showErr(msg, el) {
  var e = $('err'); e.textContent = msg; e.classList.remove('hid');
  [].forEach.call(document.querySelectorAll('.bad'), function (x) { x.classList.remove('bad'); });
  if (el) { el.classList.add('bad'); try { if (el.focus && el.tagName !== 'DIV') el.focus({ preventScroll: true }); } catch (x) {} }
}
function clearErr() { $('err').classList.add('hid'); [].forEach.call(document.querySelectorAll('.bad'), function (x) { x.classList.remove('bad'); }); }

/* ---------- Proof of payment (image or PDF) ---------- */
function isPDF(f) { return f.type === 'application/pdf' || /\.pdf$/i.test(f.name || ''); }
function isImg(f) { return /^image\//.test(f.type || ''); }
function fmtSize(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB'; }
function shrink(f) { /* downscale big photos so the upload is fast */
  return new Promise(function (res) {
    if (!isImg(f) || /gif|svg|heic|heif/i.test(f.type) || f.size < 1.2 * 1048576) return res(f);
    var url = URL.createObjectURL(f), im = new Image();
    im.onload = function () {
      try {
        var k = Math.min(1, 1800 / Math.max(im.width, im.height)), cv = document.createElement('canvas');
        cv.width = Math.round(im.width * k); cv.height = Math.round(im.height * k);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        cv.toBlob(function (b) { URL.revokeObjectURL(url); res(b && b.size < f.size ? new File([b], (f.name || 'proof').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : f); }, 'image/jpeg', 0.82);
      } catch (e) { URL.revokeObjectURL(url); res(f); }
    };
    im.onerror = function () { URL.revokeObjectURL(url); res(f); };
    im.src = url;
  });
}
function setFile(f) {
  if (!f) return;
  if (!isPDF(f) && !isImg(f)) return showErr('Proof of payment must be an image or a PDF.', $('drop'));
  if (f.size > MAX_BYTES) return showErr('The file is too large (max 10 MB).', $('drop'));
  clearErr();
  shrink(f).then(function (g) {
    if (g.size > MAX_BYTES) return showErr('The file is too large (max 10 MB).', $('drop'));
    file = g;
    var th = $('th'); th.style.backgroundImage = ''; th.textContent = '';
    if (isImg(g)) { var r = new FileReader(); r.onload = function () { th.style.backgroundImage = 'url("' + r.result + '")'; }; r.readAsDataURL(g); } else th.textContent = 'PDF';
    var n = $('fname'); n.textContent = g.name || 'Pasted image'; var s = document.createElement('small'); s.textContent = fmtSize(g.size); n.appendChild(s);
    $('drop').classList.add('hid'); $('filebox').classList.remove('hid');
  });
}
function clearFile() { file = null; $('file').value = ''; $('filebox').classList.add('hid'); $('drop').classList.remove('hid'); }

/* ---------- Server messages (stop-gap translation until n8n answers in English) ---------- */
var ES_EN = {
  'No pudimos validar su sesión. Abra el formulario desde el botón del grupo en Telegram.': 'We could not validate your session. Open the form from the button in the Telegram group.',
  'No reconocemos este grupo. Contacte a Soporte de Flash.': 'We do not recognize this group. Please contact Flash Support.',
  'No encontramos su acceso a este grupo. Solo los miembros pueden reportar incidencias.': 'We could not find your access to this group. Only group members can submit requests.',
  'No pudimos registrar la incidencia. Inténtelo nuevamente en unos minutos.': 'We could not register your request. Please try again in a few minutes.',
  'Ingrese el TXN_ID.': 'Enter the Transaction Number (TXN_ID).',
  'Ingrese un monto válido.': 'Enter a valid amount.',
  'Ingrese un correo válido.': 'Enter a valid e-mail.',
  'Seleccione el país.': 'Select the country.',
  'Seleccione el sitio.': 'Select the merchant.'
};
function tr(m) { return ES_EN[m] || m || 'Something went wrong. Please try again.'; }

/* ---------- Submit ---------- */
function collect() {
  var cur = country ? COUNTRIES[country].cur : '';
  if (cfg.multi) {
    var mv = $('merchant').value.trim();
    if (mv.length < 2) return showErr('Enter the merchant name.', $('merchant'));
  }
  if (cfg.countries.length > 1 && !country) return showErr('Select the country.', $('country-f').querySelector('.seg'));
  var txn = $('txn').value.replace(/\s+/g, '');
  if (!txn) return showErr('Enter the Transaction Number (TXN_ID).', $('txn'));
  var amt = parseAmount($('amount').value);
  if (isNaN(amt) || !(amt > 0)) return showErr('Enter a valid amount.', $('amount'));
  var cpf = '';
  if (country === 'BR') {
    cpf = $('cpf').value.replace(/\D/g, '');
    if (!validCPF(cpf)) return showErr('Enter a valid CPF (11 digits).', $('cpf'));
  }
  var em = $('email').value.trim();
  if (em && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)) return showErr('Enter a valid e-mail.', $('email'));
  return { txn: txn, amount: String(amt), currency: cur, country: country, cpf: cpf, merchant_name: cfg.multi ? $('merchant').value.trim() : '', email: em, comment: $('comment').value.trim() };
}
function submit(ev) {
  ev.preventDefault(); if (busy) return; clearErr();
  var d = collect(); if (!d) return;
  var fd = new FormData();
  fd.append('origen', 'miniapp'); fd.append('initData', (tg && tg.initData) || ''); fd.append('code', F.code || '');
  Object.keys(d).forEach(function (k) { fd.append(k, d[k]); });
  if (file) fd.append('receipt', file, file.name || 'proof');
  setBusy(true);
  if (!F.ENDPOINT) { setTimeout(function () { setBusy(false); done({ status: 'ok', ticket: 'F-1001234567890.' + Date.now() }); }, 500); return; }
  fetch(F.ENDPOINT, { method: 'POST', body: fd }).then(function (r) { return r.json(); }).then(function (j) {
    setBusy(false);
    if (j && (j.status === 'ok' || j.status === 'duplicate')) done(j); else showErr(tr(j && j.message));
  }).catch(function () { setBusy(false); showErr('Connection problem. Check your internet and try again.'); });
}
function setBusy(b) { busy = b; var g = $('go'); g.disabled = b; g.textContent = b ? 'Sending…' : 'Submit request'; }
function done(j) {
  lastTicket = j.ticket || '';
  var dup = j.status === 'duplicate';
  $('res').classList.toggle('warn', dup);
  $('res-ic').textContent = dup ? '!' : '✓';
  $('res-h').textContent = dup ? 'Already registered' : 'Request received';
  $('res-p').textContent = dup ? 'This transaction was already reported. Our team is on it.' : 'We will reply in the group as soon as Support reviews it.';
  var t = $('res-t'); t.textContent = lastTicket; t.classList.toggle('hid', !lastTicket);
  $('form').classList.add('hid'); $('res').classList.remove('hid');
  try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(dup ? 'warning' : 'success'); } catch (e) {}
}
function reset() {
  ['merchant', 'txn', 'amount', 'cpf', 'email', 'comment'].forEach(function (i) { $(i).value = ''; });
  clearFile(); clearErr(); if (cfg && cfg.countries.length > 1) setCountry('');
  $('res').classList.add('hid'); $('form').classList.remove('hid');
}

/* ---------- Wiring ---------- */
$('form').addEventListener('submit', submit);
$('cpf').addEventListener('input', function () { this.value = maskCPF(this.value); });
$('country-f').addEventListener('click', function (e) { var b = e.target.closest('button[data-c]'); if (b) { setCountry(b.getAttribute('data-c')); clearErr(); } });
$('pick').addEventListener('click', function () { $('file').click(); });
$('file').addEventListener('change', function () { setFile(this.files[0]); });
$('rm').addEventListener('click', clearFile);
var dz = $('drop');
['dragenter', 'dragover'].forEach(function (n) { dz.addEventListener(n, function (e) { e.preventDefault(); dz.classList.add('over'); }); });
['dragleave', 'drop'].forEach(function (n) { dz.addEventListener(n, function (e) { e.preventDefault(); dz.classList.remove('over'); }); });
dz.addEventListener('drop', function (e) { setFile(e.dataTransfer && e.dataTransfer.files[0]); });
document.addEventListener('paste', function (e) {
  var its = (e.clipboardData && e.clipboardData.items) || [];
  for (var i = 0; i < its.length; i++) if (its[i].kind === 'file') { var f = its[i].getAsFile(); if (f) { setFile(f); e.preventDefault(); return; } }
});
$('res-close').addEventListener('click', function () { if (tg && tg.close) tg.close(); else reset(); });
$('res-new').addEventListener('click', reset);
['txn', 'amount', 'cpf', 'email', 'merchant', 'comment'].forEach(function (i) { $(i).addEventListener('input', function () { this.classList.remove('bad'); }); });

/* ---------- Start ---------- */
function show() { $('form').classList.remove('hid'); }
if (!F.ENDPOINT) { /* demo mode (no backend): scenario picker */
  var q = (/[?&]demo=(\w+)/.exec(location.search) || [])[1];
  $('demo').classList.remove('hid');
  $('demo-sel').addEventListener('change', function () { applyConfig(sanitize(DEMO[this.value])); reset(); });
  if (q && DEMO[q]) $('demo-sel').value = q;
  applyConfig(sanitize(DEMO[$('demo-sel').value])); show();
} else {
  var cached = readCache(), shown = false;
  var first = function (c) { if (shown) return; shown = true; applyConfig(sanitize(c)); show(); };
  if (cached) first(cached);
  else { setTimeout(function () { first({}); }, 1500); }
  if (F.cfgReq) F.cfgReq.then(function (c) {
    if (!c || c.found === false) { if (c && c.found === false && !shown) { shown = true; show(); showErr('We do not recognize this group. Please contact Flash Support.'); } return; }
    writeCache(c);
    var n = sanitize(c);
    if (!shown) first(c); else if (JSON.stringify(n) !== JSON.stringify(cfg)) applyConfig(n);
  });
  else if (!cached) first({});
}
})();
</script>
</body>
</html>
